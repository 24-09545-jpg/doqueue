{# Shared component styles: same look as the existing dashboard partial, reused by the new portal pages. #}
<style>
  .welcome-block { margin-bottom: 18px; }
  .welcome-title { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 4px; }
  .welcome-sub { font-size: 13px; color: #6b7280; }

  .announce-box {
    background: #fffbeb; border: 1px solid #fde68a; border-left: 4px solid #f59e0b;
    border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #78350f;
    margin-bottom: 16px; white-space: pre-line;
  }
  .announce-box strong { display: block; margin-bottom: 2px; color: #92400e; }

  .summary-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
  .summary-strip.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .summary-strip.cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .summary-card { background: #ffffff; border-radius: 10px; border: 1px solid #e5e7eb; padding: 10px 12px; font-size: 12px; box-shadow: var(--shadow-xs); }
  .summary-label { color: #6b7280; text-transform: uppercase; font-weight: 600; font-size: 11px; margin-bottom: 3px; }
  .summary-value { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: #111827; }

  .status-shell { background: #ffffff; border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: var(--shadow-sm); margin-top: 6px; overflow: hidden; }
  .status-shell + .status-shell { margin-top: 18px; }
  .status-tabs { display: flex; gap: 8px; padding: 10px 16px 0; border-bottom: 1px solid #e5e7eb; background: #f9fafb; flex-wrap: wrap; }
  .status-tab { position: relative; padding: 8px 16px; font-size: 13px; font-weight: 400; border-radius: 999px 999px 0 0; border: 1px solid transparent; border-bottom: 1px solid transparent; background: #f9fafb; color: #6b7280; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .status-tab img { opacity: 0.35; filter: grayscale(1); }
  .status-tab.active { background: #ffffff; color: #b91c1c; border-color: #e5e7eb; border-bottom: 1px solid #ffffff; font-weight: 600; }
  .status-tab.active img { opacity: 1; filter: none; }
  .status-tab-count { font-size: 11px; color: #6b7280; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 999px; padding: 0 7px; }
  .status-panel-header { padding: 10px 16px 0; font-size: 14px; font-weight: 700; color: #111827; display: flex; justify-content: space-between; align-items: center; }
  .status-panel-sub { padding: 2px 16px 10px; font-size: 12px; color: #6b7280; border-bottom: 1px solid #e5e7eb; }
  .status-panel-body { padding: 14px 16px 16px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .table-scroll { width: 100%; overflow-x: auto; }
  table.status-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  table.status-table thead tr { background: #f3f4f6; }
  table.status-table th { padding: 6px 8px; text-align: center; border-bottom: 1px solid #e5e7eb; border-left: 1px solid #e5e7eb; vertical-align: middle; }
  table.status-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #e5e7eb; border-left: 1px solid #e5e7eb; vertical-align: top; }
  .muted { color: #9ca3af; }
  .small { font-size: 11px; color: #6b7280; }

  .status-pill { display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .status-pending { background: #e0ecff; color: lch(39.02% 83.15 296.25); }
  .status-viewed { background: #cffafe; color: #0369a1; }
  .status-ongoing { background: #fff5cb; color: #b38f00; }
  .status-declined-pill { background: #fee2e2; color: #b91c1c; }
  .status-completed-pill { background: #dcfce7; color: #166534; }
  .status-returned-pill { background: #ffedd5; color: #c2410c; }
  .status-expired-pill { background: #fef3c7; color: #92400e; }
  .status-muted-pill { background: #f3f4f6; color: #6b7280; }

  .view-link { display: inline-block; font-size: 11px; font-weight: 600; color: #2563eb; text-decoration: none; background: none; border: none; padding: 0; cursor: pointer; }
  .view-link:hover { text-decoration: underline; }
  .empty-state { text-align: center; padding: 40px 10px; font-size: 13px; color: #9ca3af; }

  .status-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; align-items: center; }
  .status-filter-input { flex: 1 1 160px; padding: 6px 10px; border-radius: 999px; border: 1px solid #d1d5db; font-size: 13px; }
  .status-filter-select { flex: 0 0 auto; padding: 6px 10px; border-radius: 999px; border: 1px solid #d1d5db; font-size: 13px; background: #ffffff; }

  /* progress tracker */
  .trk { min-width: 150px; }
  .trk-bar { height: 8px; border-radius: 999px; background: #e5e7eb; overflow: hidden; }
  .trk-fill { height: 100%; border-radius: 999px; background: #16a34a; transition: width 0.4s ease; }
  .trk-fill.stopped { background: #dc2626; }
  .trk-meta { font-size: 11px; color: #6b7280; margin-top: 3px; display: flex; justify-content: space-between; gap: 6px; }

  /* panels & forms (same look as Settings / Request Signature) */
  .panel { background: #ffffff; border-radius: 14px; border: 1px solid #e5e7eb; box-shadow: var(--shadow-sm, 0 8px 18px rgba(15,23,42,0.08)); padding: 14px 16px 16px; margin-bottom: 16px; }
  .panel-title { font-size: 15px; font-weight: 700; color: #111827; }
  .panel-sub { font-size: 12px; color: #6b7280; margin: 2px 0 12px; }
  .panel-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .panel-grid > .panel { flex: 1 1 320px; margin-bottom: 0; }
  .form-row { margin-bottom: 10px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
  .form-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; display: inline-block; }
  .form-input, .form-textarea, .form-select { width: 100%; border-radius: 10px; border: 1px solid #d1d5db; padding: 8px 10px; font-size: 14px; outline: none; background: #f9fafb; font-family: inherit; }
  .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: #16a34a; box-shadow: 0 0 0 1px rgba(22, 163, 74, 0.2); background: #ffffff; }
  .form-textarea { resize: vertical; min-height: 70px; }
  .field-error { margin-top: 3px; font-size: 12px; color: #b91c1c; }
  .hint { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .btn-danger-outline { background: #ffffff; color: #b91c1c; border: 1px solid #fecaca; }
  .btn-danger-outline:hover { background: #fef2f2; }
  .inline-form { display: inline; }
  details.row-edit summary { cursor: pointer; list-style: none; }
  details.row-edit summary::-webkit-details-marker { display: none; }
  details.row-edit[open] { background: #f9fafb; }
  .edit-box { padding: 10px 0 4px; }

  @media (max-width: 900px) {
    .summary-strip, .summary-strip.cols-4, .summary-strip.cols-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
